version: '3.8'

services:
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '1337'
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: 'myKeyA1b2C3d4,myKeyE5f6G7h8'
      JWT_SECRET: 'myJwtSecret1234567890'
      DB: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
    volumes:
      - strapi-uploads:/app/examples/getstarted/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U strapi']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy

volumes:
  pgdata:
  strapi-uploads:
networks:
  proxy:
    external: true
